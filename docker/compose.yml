# See README.md in this folder. setup.sh writes the .env this reads.
name: euroton
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: euroton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run setup.sh}
      POSTGRES_DB: euroton
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U euroton -d euroton"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [euroton]

  server:
    image: ${EUROTON_SERVER_IMAGE:-ghcr.io/euroton/euroton-server:0.2.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://euroton:${POSTGRES_PASSWORD}@postgres:5432/euroton
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?run setup.sh}
      OPERATOR_ORIGIN: https://godmode.${EUROTON_DOMAIN}:8443
      LOCAL_MAIL_DOMAIN: ${EUROTON_DOMAIN}
      EXTRA_MAIL_DOMAINS: ${EXTRA_MAIL_DOMAINS:-}
      ACCOUNT_APP_URL: https://account.${EUROTON_DOMAIN}
      TRUST_PROXY: 172.31.77.0/24
      CORS_ORIGINS: https://mail.${EUROTON_DOMAIN},https://account.${EUROTON_DOMAIN},https://calendar.${EUROTON_DOMAIN},https://godmode.${EUROTON_DOMAIN}:8443
      COOKIE_SECURE: "true"
      BRAND_NAME: ${BRAND_NAME:-Euroton}
    volumes:
      - server-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks: [euroton]

  web:
    image: ${EUROTON_WEB_IMAGE:-ghcr.io/euroton/euroton-web:0.2.0}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      EUROTON_DOMAIN: ${EUROTON_DOMAIN:?run setup.sh}
      EUROTON_TLS: ${EUROTON_TLS:-internal}
    ports:
      - "443:443"
      # Godmode has a SQL console. Reach it through an SSH tunnel; don't change this bind.
      - "127.0.0.1:8443:8443"
    volumes:
      - server-data:/srv/server-data:ro
      - web-patched:/srv/web
      - caddy-data:/data
    networks: [euroton]

networks:
  euroton:
    ipam:
      config:
        - subnet: 172.31.77.0/24

volumes:
  postgres-data:
  server-data:
  web-patched:
  caddy-data:
